dataset:
  raw_csv_path: "data/raw/dc_telemetry_30d.csv"
  days: 30
  seed: 42

architecture:
  seq_len: 24
  horizon: 12
  hidden_dim: 128
  num_layers: 2
  dropout: 0.15

training:
  epochs: 35
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  train_split: 0.80
  save_path: "artifacts/lstm_forecaster.pt"
